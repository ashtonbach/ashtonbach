  <!-- Locked brand (not shown here): Forest Mist A #B0CBBC · B #E8EEE9 · bg #14201A;
       soft AB junction-fixed SVG at brand/clean/ashtonbach-ab.svg — see brand/README.md -->
  <style>
    :root { --forest: #14201A; --sage: #B0CBBC; --mist: #E8EEE9; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--forest);
      color: var(--mist);
      overflow: hidden;
    }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 8px 8px 0;
      position: relative;
    }
    .tree {
      display: block;
      width: min(99vw, 1600px);
      height: auto;
      max-height: calc(100dvh - 8px);
      object-fit: contain;
      object-position: bottom center;
      opacity: 0.055;
      pointer-events: none;
      user-select: none;
    }

    .lockup {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(20px, 3vw, 36px);
      text-decoration: none;
      color: inherit;
      pointer-events: auto;
    }
    .lockup:link,
    .lockup:visited,
    .lockup:hover,
    .lockup:active,
    .lockup:focus {
      color: inherit;
      text-decoration: none;
      outline: none;
    }
    .lockup-mark {
      display: block;
      width: clamp(180px, 18vw, 260px);
      height: auto;
      flex: 0 0 auto;
      opacity: 1;
      pointer-events: none;
      user-select: none;
      border: 2px solid var(--mist);
      border-radius: 50%;
      padding: clamp(6px, 1vw, 10px);
      background: transparent;
    }
    .lockup-rule {
      width: clamp(160px, 20vw, 260px);
      height: 1px;
      background: var(--mist);
      opacity: 0.15;
      margin: clamp(10px, 1.8vw, 18px) 0;
    }
    .lockup-word {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(28px, 5.5vw, 54px);
      font-weight: 400;
      letter-spacing: 0.155em;
      color: #E8EEE9;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
      user-select: none;
    }

  </style>
